<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo A – Celestia Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05030f;font-family:system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.badge{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:5px 20px;border-radius:20px;font:11px/1.6 monospace;z-index:10;white-space:nowrap;letter-spacing:.05em}
.hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:5;text-align:center;padding:0 20px}
h1{font-size:clamp(3rem,10vw,9rem);font-weight:900;color:#fff;line-height:1;letter-spacing:-.03em;text-shadow:0 2px 60px rgba(0,0,0,.6)}
.sub{color:rgba(255,255,255,.38);margin-top:16px;font-size:1.05rem;letter-spacing:.18em;text-transform:uppercase}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:32px;padding:20px;z-index:6;color:rgba(255,255,255,.35);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Demo A — Celestia Style · Atmospheric Cloud Shader · No 3D Object</div>
<nav class="nav">
  <span>Home</span><span>About</span><span>Skills</span><span>Projects</span><span>Contact</span>
</nav>
<div class="hero">
  <h1>Ayush Patel</h1>
  <p class="sub">Software Engineer</p>
</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

const vs = `attribute vec2 p; void main(){gl_Position=vec4(p,0.,1.);}`;

const fs = `
precision highp float;
uniform float T;
uniform vec2 R;
uniform vec2 M;

float H(float n){return fract(sin(n)*43758.5453);}

float N(vec3 x){
  vec3 i=floor(x), f=fract(x);
  f=f*f*(3.-2.*f);
  float n=i.x+i.y*57.+113.*i.z;
  return mix(
    mix(mix(H(n),H(n+1.),f.x),mix(H(n+57.),H(n+58.),f.x),f.y),
    mix(mix(H(n+113.),H(n+114.),f.x),mix(H(n+170.),H(n+171.),f.x),f.y),
    f.z);
}

float F(vec3 p){
  float v=0.,a=.5;
  for(int i=0;i<6;i++){v+=a*N(p);p*=2.03;a*=.47;}
  return v;
}

void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec2 st=(uv*2.-1.)*vec2(R.x/R.y,1.);
  vec2 m=(M/R*2.-1.)*vec2(R.x/R.y,1.);
  float t=T*.05;

  vec3 p=vec3(st*1.5+m*.08, t);

  // Domain-warped fbm — makes organic cloud shapes
  vec3 q=vec3(F(p+vec3(0.,0.,0.)),
               F(p+vec3(5.2,1.3,2.8)),
               F(p+vec3(1.2,3.4,5.6)));

  vec3 r=vec3(F(p+3.*q+vec3(1.7,9.2,0.)),
               F(p+3.*q+vec3(8.3,2.8,1.)),
               F(p+3.*q+vec3(4.5,7.2,9.)));

  float cloud=F(p+3.*r)*.5+.5;

  // Palette: near-black + soft blue-gray wisps (like Celestia's moody sky)
  vec3 base=vec3(0.019,0.010,0.058); // #05030f
  vec3 midCloud=vec3(0.14,0.16,0.22); // dark blue-gray
  vec3 brightCloud=vec3(0.28,0.31,0.42); // lighter wisps
  vec3 blueHaze=vec3(0.06,0.09,0.22); // blue glow near bottom

  float softCloud=smoothstep(.30,.75,cloud);
  float brightLayer=smoothstep(.62,.90,cloud);

  vec3 col=base;
  col=mix(col, midCloud, softCloud*.55);
  col=mix(col, brightCloud, brightLayer*.45);

  // Blue atmospheric glow at the bottom horizon
  col+=blueHaze*(1.-uv.y)*smoothstep(.38,.68,cloud)*.4;

  // Darken top slightly for depth
  col*=mix(.8,1.,uv.y*.6+.4);

  // Vignette
  float vig=dot(st*.52,st*.52);
  col*=1.-vig*.85;

  gl_FragColor=vec4(col,1.);
}`;

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(ap);
gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);

const uT = gl.getUniformLocation(prog, 'T');
const uR = gl.getUniformLocation(prog, 'R');
const uM = gl.getUniformLocation(prog, 'M');

let mx = innerWidth/2, my = innerHeight/2;
document.addEventListener('mousemove', e => { mx = e.clientX; my = innerHeight - e.clientY; });

function resize() {
  const pr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * pr;
  canvas.height = innerHeight * pr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const t0 = performance.now();
(function frame() {
  const t = (performance.now() - t0) / 1000;
  const pr = Math.min(devicePixelRatio, 2);
  gl.uniform1f(uT, t);
  gl.uniform2f(uR, canvas.width, canvas.height);
  gl.uniform2f(uM, mx * pr, my * pr);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
