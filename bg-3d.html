<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Background Demo — Ayush Patel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05050b; font-family: Inter, system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; display: block; }
  .hero { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  .name { font-weight: 800; letter-spacing: -.03em; line-height: .95; color: #fff;
    font-size: clamp(3rem, 10vw, 9rem); text-shadow: 0 2px 40px rgba(0,0,0,.5); }
  .grad { background: linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6,#60a5fa);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: slide 8s linear infinite; }
  @keyframes slide { to { background-position: 300% 0; } }
  .sub { margin-top: 1.4rem; font-size: clamp(.7rem,1.1vw,.95rem); letter-spacing: .35em;
    text-transform: uppercase; color: rgba(255,255,255,.5); }
  .switch { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 8px; padding: 6px; border-radius: 100px;
    background: rgba(20,20,30,.6); backdrop-filter: blur(14px); border: .5px solid rgba(255,255,255,.12); }
  .switch button { font-family: inherit; font-size: 12px; letter-spacing: .04em; color: rgba(255,255,255,.55);
    background: transparent; border: none; padding: 9px 18px; border-radius: 100px; cursor: pointer; transition: all .25s; }
  .switch button:hover { color: #fff; }
  .switch button.on { color: #fff; background: rgba(255,255,255,.12); }
  .tag { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 50;
    font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.3); }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hero">
    <h1 class="name">Ayush <span class="grad">Patel</span></h1>
    <p class="sub">BS in Computer Science</p>
  </div>
  <div class="tag" id="tag">D1 · Iridescent Blob</div>
  <div class="switch">
    <button class="on" data-id="blob">Blob</button>
    <button data-id="particles">Particles</button>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
  import * as THREE from 'three';

  const snoise = `
  vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);
    vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }`;

  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.z = 4.2;

  const mouse = new THREE.Vector2(0, 0);
  const target = new THREE.Vector2(0, 0);
  addEventListener('mousemove', e => {
    target.x = (e.clientX / innerWidth) * 2 - 1;
    target.y = -((e.clientY / innerHeight) * 2 - 1);
  });

  // ── BLOB ─────────────────────────────────────────────
  const blobMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uMouse: { value: new THREE.Vector2() } },
    vertexShader: snoise + `
      uniform float uTime; varying float vDisp; varying vec3 vNormal; varying vec3 vView;
      vec3 displace(vec3 p){ float n = snoise(p*0.9 + uTime*0.25) * 0.55
        + snoise(p*2.1 - uTime*0.18) * 0.18; return p + normal * n; }
      void main(){
        vec3 dp = displace(position);
        float e = 0.08; vec3 tangent = normalize(cross(normal, vec3(0.0,1.0,0.0)) + 0.001);
        vec3 bitan = normalize(cross(normal, tangent));
        vec3 n1 = displace(position + tangent*e); vec3 n2 = displace(position + bitan*e);
        vNormal = normalize(cross(n1 - dp, n2 - dp)) * -1.0;
        vDisp = length(dp - position);
        vec4 mv = modelViewMatrix * vec4(dp,1.0); vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vDisp; varying vec3 vNormal; varying vec3 vView;
      void main(){
        vec3 blue=vec3(0.376,0.647,0.980); vec3 violet=vec3(0.655,0.545,0.980); vec3 pink=vec3(0.957,0.447,0.714);
        float f = pow(1.0 - max(dot(normalize(vNormal), normalize(vView)), 0.0), 2.6);
        vec3 base = mix(blue, violet, smoothstep(0.0,0.4,vDisp));
        base = mix(base, pink, smoothstep(0.4,0.8,vDisp));
        vec3 col = base * (0.18 + f * 0.85);
        col += pink * pow(f, 1.5) * 0.35;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95, 80), blobMat);

  // ── PARTICLES ────────────────────────────────────────
  const COUNT = 9000; const pos = new Float32Array(COUNT * 3); const rnd = new Float32Array(COUNT);
  for (let i = 0; i < COUNT; i++){
    const t = Math.acos(2 * Math.random() - 1), p = Math.random() * Math.PI * 2, r = 1.5;
    pos[i*3] = r*Math.sin(t)*Math.cos(p); pos[i*3+1] = r*Math.sin(t)*Math.sin(p); pos[i*3+2] = r*Math.cos(t);
    rnd[i] = Math.random();
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  pGeo.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 1));
  const pMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 } },
    vertexShader: snoise + `
      uniform float uTime; attribute float aRnd; varying float vMix;
      void main(){
        vec3 p = position; float n = snoise(p*0.8 + uTime*0.15);
        p *= 1.0 + n*0.28; vMix = aRnd;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        gl_PointSize = (12.0 + aRnd*22.0) / -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vMix;
      void main(){
        float d = length(gl_PointCoord - 0.5); if(d>0.5) discard;
        float a = smoothstep(0.5,0.0,d);
        vec3 blue=vec3(0.376,0.647,0.980); vec3 violet=vec3(0.655,0.545,0.980); vec3 pink=vec3(0.957,0.447,0.714);
        vec3 col = mix(blue, violet, vMix); col = mix(col, pink, smoothstep(0.6,1.0,vMix));
        gl_FragColor = vec4(col, a*0.7);
      }`,
  });
  const particles = new THREE.Points(pGeo, pMat);
  particles.visible = false;
  scene.add(blob); scene.add(particles);

  let mode = 'blob';
  const labels = { blob: 'D1 · Iridescent Blob', particles: 'D2 · Particle Field' };
  document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.id;
    blob.visible = mode === 'blob'; particles.visible = mode === 'particles';
    document.querySelectorAll('.switch button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('tag').textContent = labels[mode];
  }));

  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const clock = new THREE.Clock();
  function tick(){
    const t = clock.getElapsedTime();
    mouse.lerp(target, 0.05);
    blobMat.uniforms.uTime.value = t; pMat.uniforms.uTime.value = t;
    const grp = mode === 'blob' ? blob : particles;
    grp.rotation.y += 0.0015; grp.rotation.x = mouse.y * 0.4; grp.rotation.z = mouse.x * 0.2;
    blob.rotation.y = particles.rotation.y;
    camera.position.x = mouse.x * 0.5; camera.position.y = mouse.y * 0.5; camera.lookAt(0,0,0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
  </script>
</body>
</html>
