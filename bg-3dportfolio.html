<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo C – 3D Portfolio Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05030f;font-family:system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;display:block}
.badge{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:5px 20px;border-radius:20px;font:11px/1.6 monospace;z-index:10;white-space:nowrap;letter-spacing:.05em}
.hero{
  position:fixed;top:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:18vh;
  pointer-events:none;z-index:5;text-align:center
}
h1{font-size:clamp(3rem,10vw,9rem);font-weight:900;color:#fff;line-height:1;letter-spacing:-.03em}
.sub{color:rgba(255,255,255,.35);margin-top:14px;font-size:1.05rem;letter-spacing:.18em;text-transform:uppercase}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:32px;padding:20px;z-index:6;color:rgba(255,255,255,.3);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.note{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.25);font-size:11px;z-index:10;font-family:monospace;white-space:nowrap;letter-spacing:.06em}
</style>
</head>
<body>
<div class="badge">Demo C — 3D Portfolio Style · Centered 3D Hero Object</div>
<nav class="nav">
  <span>About</span><span>Price</span><span>Projects</span><span>Contact</span>
</nav>
<div class="hero">
  <h1>Ayush Patel</h1>
  <p class="sub">Software Engineer</p>
</div>
<p class="note">Note: The "Hi, I'm Jack" style uses a custom 3D character model — this shows the composition &amp; vibe</p>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05030f);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
Object.assign(renderer.domElement.style, {
  position:'fixed', inset:'0', zIndex:'0', width:'100%', height:'100%'
});

// Lights
scene.add(new THREE.AmbientLight(0x0a0520, 3));

const keyLight = new THREE.DirectionalLight(0x60a5fa, 4); // blue key light
keyLight.position.set(-3, 5, 4);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xa78bfa, 8, 15); // violet fill
fillLight.position.set(3, 0, 3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xf472b6, 5, 12); // pink rim
rimLight.position.set(0, -4, 2);
scene.add(rimLight);

const topLight = new THREE.PointLight(0xffffff, 3, 8);
topLight.position.set(0, 6, 2);
scene.add(topLight);

// ── Main hero object: stylized abstract form ──
// Since we can't load a 3D character model, we create an abstract
// "portrait-like" shape using layered spheres + displacement feel
const group = new THREE.Group();
// Push to bottom-center like the Jack portfolio
group.position.set(0, -2.8, 0);
scene.add(group);

// Body (large rounded base)
const bodyGeo = new THREE.SphereGeometry(1.8, 32, 32);
const bodyMat = new THREE.MeshPhongMaterial({
  color: 0x0f0728,
  emissive: 0x1e0b4e,
  emissiveIntensity: 0.4,
  specular: 0xa78bfa,
  shininess: 80,
});
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.scale.set(1, 1.4, 0.7);
body.position.set(0, -0.5, 0);
group.add(body);

// Head (sphere)
const headGeo = new THREE.SphereGeometry(1.1, 32, 32);
const headMat = new THREE.MeshPhongMaterial({
  color: 0x120930,
  emissive: 0x2d1470,
  emissiveIntensity: 0.5,
  specular: 0xc4b5fd,
  shininess: 120,
});
const head = new THREE.Mesh(headGeo, headMat);
head.position.set(0, 1.85, 0.15);
group.add(head);

// Floating accent ring around head (like a halo/glow ring)
const ringGeo = new THREE.TorusGeometry(1.45, 0.04, 8, 80);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.6 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.position.set(0, 1.85, 0.15);
ring.rotation.x = Math.PI * 0.35;
group.add(ring);

// Shoulder/arms (flattened spheres)
for (let side of [-1, 1]) {
  const shoulderGeo = new THREE.SphereGeometry(0.75, 24, 24);
  const shoulder = new THREE.Mesh(shoulderGeo, bodyMat.clone());
  shoulder.scale.set(1.3, 0.9, 0.7);
  shoulder.position.set(side * 1.85, 0.3, 0);
  group.add(shoulder);
}

// Glowing eye-like features on head
for (let side of [-1, 1]) {
  const eyeGeo = new THREE.SphereGeometry(0.12, 12, 12);
  const eyeMat = new THREE.MeshBasicMaterial({ color: side === -1 ? 0x60a5fa : 0xa78bfa });
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(side * 0.35, 1.95, 1.0);
  group.add(eye);
}

// ── Floating 3D elements around the figure (like the Jack portfolio) ──
// Blue sphere (top-left)
const floatSphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.38, 24, 24),
  new THREE.MeshPhongMaterial({
    color: 0x1e3a8a,
    emissive: 0x3b82f6,
    emissiveIntensity: 0.9,
    specular: 0xffffff,
    shininess: 200,
    transparent: true,
    opacity: 0.9,
  })
);
floatSphere.position.set(-2.8, 1.5, 0.5);
scene.add(floatSphere);

// Purple cube (top-right)
const floatCube = new THREE.Mesh(
  new THREE.BoxGeometry(0.55, 0.55, 0.55),
  new THREE.MeshPhongMaterial({
    color: 0x2e1065,
    emissive: 0x7c3aed,
    emissiveIntensity: 0.9,
    specular: 0xffffff,
    shininess: 160,
    transparent: true,
    opacity: 0.88,
  })
);
floatCube.position.set(3.1, 1.8, 0.3);
scene.add(floatCube);

// Small pink octahedron (bottom-right)
const floatOcta = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.3),
  new THREE.MeshPhongMaterial({
    color: 0x4a0030,
    emissive: 0xf472b6,
    emissiveIntensity: 0.8,
    specular: 0xffffff,
    shininess: 220,
    transparent: true,
    opacity: 0.85,
  })
);
floatOcta.position.set(2.5, -3.2, 0.8);
scene.add(floatOcta);

// ── Floor reflection plane ──
const floorGeo = new THREE.PlaneGeometry(20, 6);
const floorMat = new THREE.MeshBasicMaterial({
  color: 0x05030f,
  transparent: true,
  opacity: 0.0,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.8;
scene.add(floor);

// Subtle dark platform under the character
const platformGeo = new THREE.CylinderGeometry(2.2, 2.5, 0.18, 40);
const platformMat = new THREE.MeshPhongMaterial({
  color: 0x0a0520,
  emissive: 0x1e0b4e,
  emissiveIntensity: 0.2,
  transparent: true,
  opacity: 0.7,
});
const platform = new THREE.Mesh(platformGeo, platformMat);
platform.position.set(0, -4.6, 0);
scene.add(platform);

// ── Background ambient particles (star-field dots) ──
const particleCount = 120;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  pPos[i*3]   = (Math.random()-0.5)*20;
  pPos[i*3+1] = (Math.random()-0.5)*12;
  pPos[i*3+2] = -3 - Math.random()*5;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x8888cc, size: 0.03, transparent: true, opacity: 0.5 });
scene.add(new THREE.Points(pGeo, pMat));

// Mouse
let tX = 0, tY = 0, cX = 0, cY = 0;
document.addEventListener('mousemove', e => {
  tX = (e.clientX/innerWidth - 0.5) * 2;
  tY = -(e.clientY/innerHeight - 0.5) * 2;
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
(function frame() {
  const t = (performance.now()-t0)/1000;
  cX += (tX-cX)*0.04;
  cY += (tY-cY)*0.04;

  // Idle sway on the figure
  group.rotation.y = cX * 0.12 + Math.sin(t*0.4)*0.03;
  group.position.y = -2.8 + Math.sin(t*0.5)*0.06;

  // Head subtle nod
  head.rotation.y = cX * 0.08;
  head.rotation.x = cY * 0.05;
  ring.rotation.z = t * 0.3;

  // Floating objects orbit
  floatSphere.position.x = -2.8 + Math.sin(t*0.6)*0.3;
  floatSphere.position.y = 1.5 + Math.cos(t*0.4)*0.25;
  floatSphere.rotation.y = t*0.8;

  floatCube.position.x = 3.1 + Math.cos(t*0.5)*0.25;
  floatCube.position.y = 1.8 + Math.sin(t*0.7)*0.3;
  floatCube.rotation.x = t*0.6;
  floatCube.rotation.y = t*0.4;

  floatOcta.position.x = 2.5 + Math.sin(t*0.9)*0.2;
  floatOcta.rotation.x = t*1.1;
  floatOcta.rotation.z = t*0.7;

  // Pulse fill light
  fillLight.intensity = 7 + Math.sin(t*1.2)*2;

  // Camera slight drift with mouse
  camera.position.x = cX * 0.3;
  camera.position.y = cY * 0.2;
  camera.lookAt(0, -0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
